<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release-omroeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Playfair+Display:wght@400;700&family=Source+Serif+4:wght@400;600&family=Special+Elite&display=swap">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <!-- Alle zichtbare tekst komt uit teksten.js; app.js vult deze structuur. -->
    <section id="redactie" data-thema="redactie">
        <div class="pagina">
            <header class="kopbalk">
                <div class="kopbalk__tekst">
                    <p class="onderschrift" id="merk"></p>
                    <h1 class="pagina-kop" id="redactie-kop"></h1>
                    <p class="kopbalk__meta" id="metaregel" hidden></p>
                </div>
                <div class="knoppenrij" id="kopknoppen"></div>
            </header>

            <main class="stapel" id="inhoud">
                <div id="fout" class="fout" role="alert" data-testid="fout" hidden></div>

                <section id="lege-staat" class="leeg" data-testid="lege-staat" aria-labelledby="leeg-kop" hidden></section>

                <div id="werk" class="stapel" hidden>
                    <p class="publicatie" id="publicatie"></p>
                    <div class="raster" id="kaarten"></div>
                    <div class="tellerbalk-ruimte"></div>
                    <div class="tellerbalk" id="teller" data-testid="teller"></div>
                </div>
            </main>
        </div>

        <dialog class="help" id="help" aria-labelledby="help-kop"></dialog>
        <input type="file" id="bestandskiezer" accept=".json,application/json" tabindex="-1" aria-hidden="true" hidden>
    </section>

    <section id="uitzending" class="uitzending" data-thema="uitzending" data-testid="uitzending" hidden>
        <div class="uitzending__frame" id="uitzending-frame"></div>
        <div class="balk" id="balk"></div>
        <!-- Effectlagen van het bioscoopjournaal: alleen decor, niet klikbaar en verborgen voor schermlezers.
             Flikkering en krassen bewegen alleen zonder prefers-reduced-motion (zie style.css). -->
        <div class="effect-vignet" aria-hidden="true"></div>
        <svg class="effect-korrel" aria-hidden="true" focusable="false">
            <filter id="korrel">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
                <feColorMatrix values="0 0 0 0 0.63  0 0 0 0 0.53  0 0 0 0 0.38  0 0 0 1 0"/>
            </filter>
            <rect width="100%" height="100%" filter="url(#korrel)"/>
        </svg>
        <div class="effect-flikker" aria-hidden="true"></div>
        <div class="effect-kras effect-kras--links" aria-hidden="true"></div>
        <div class="effect-kras effect-kras--rechts" aria-hidden="true"></div>
    </section>

    <!-- Buiten beide schermen, zodat meldingen ook tijdens de uitzending worden voorgelezen. -->
    <p id="melding" class="melding" role="status" aria-live="polite"></p>
</body>
</html>
