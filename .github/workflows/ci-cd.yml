# CI/CD van de Release-omroeper.
# Job test: lint en unit-tests bij een pull request naar test of main, en bij een push naar test.
# Job deploy-test: na een geslaagde test bij een push naar test zet hij public/ via SFTP op STRATO (map app1-test).
#   Er wordt niets gewist op de server; alleen de bestanden van de app worden overschreven.
# Job smoke: na de deploy, of handmatig met Run workflow (bijvoorbeeld tegen een andere URL).
# Secrets (repository secrets; environment-secrets werken niet op het gratis plan voor een privérepo):
#   SFTP_HOST, SFTP_USER, SFTP_PASSWORD, TEST_SFTP_PATH.
name: ci-cd

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL om te controleren'
        default: 'http://app1-test.caitlinveenendaal.nl/'

permissions:
  contents: read

jobs:
  test:
    name: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  deploy-test:
    name: deploy-test
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    concurrency: deploy-test
    steps:
      - uses: actions/checkout@v4
      # Alleen de app uit public/; geen tests, testdata of node_modules.
      # wlixcc/SFTP-Deploy-Action versie v1.2.6 (nieuwste release, april 2025).
      - uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          sftp_only: true
          delete_remote_files: false
          local_path: ./public/*
          remote_path: ${{ secrets.TEST_SFTP_PATH }}

  smoke:
    name: smoke
    needs: deploy-test
    # Na een geslaagde deploy, of los via Run workflow (dan is deploy-test overgeslagen).
    if: always() && (github.event_name == 'workflow_dispatch' || needs.deploy-test.result == 'success')
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'http://app1-test.caitlinveenendaal.nl/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
